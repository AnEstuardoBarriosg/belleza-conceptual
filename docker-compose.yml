services:
  postgres:
    image: postgres:16-alpine
    container_name: belleza-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/99_BellezaConceptual_Completo.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: belleza-redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth-service:
    build: ./src/auth-service
    container_name: belleza-auth
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
    ports:
      - "${AUTH_PORT}:3001"
    depends_on:
      postgres:
        condition: service_healthy

  catalog-service:
    build: ./src/catalog-service
    container_name: belleza-catalog
    environment:
      PORT: 3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "${CATALOG_PORT}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  orders-service:
    build: ./src/orders-service
    container_name: belleza-orders
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
    ports:
      - "${ORDERS_PORT}:3003"
    depends_on:
      postgres:
        condition: service_healthy

  payments-service:
    build: ./src/payments-service
    container_name: belleza-payments
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_SSL: ${DB_SSL:-false}
    ports:
      - "${PAYMENTS_PORT}:3004"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: